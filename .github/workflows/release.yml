name: Build & release patch

# v* 태그를 push하면(= 메인테이너 신뢰 컨텍스트) R2에서 fontready 베이스를 받아
# 번역을 주입하고 최종 sharedassets2.assets 를 GitHub Release 에 첨부한다.
#
# 번역 변형은 태그 접미사로 선택한다:
#   v0.1-EN        → Trans-EN2KR
#   v0.1-CHT       → Trans-CHT2KR
#   v0.1-Complex   → Trans-Complex2KR
#   v0.1           → Trans-Complex2KR (접미사 없으면 기본)
# 산출물은 항상 파일명 그대로 sharedassets2.assets 로 올라가 설치 시 개명이 필요 없다.
#
# fork PR 은 이 워크플로를 트리거할 수 없고 시크릿도 못 받음 → 자격증명 안전.
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # 태그 없이 수동 테스트용
    inputs:
      variant:
        description: '번역 변형 (EN / CHT / Complex)'
        required: true
        default: 'Complex'
        type: choice
        options: [Complex, CHT, EN]

permissions:
  contents: write         # Release 생성/업로드

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # R2 는 S3 호환 → aws-cli 로 접근. 값은 GitHub Secrets 에서 주입.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # 최신 aws-cli v2 의 기본 무결성 체크섬이 R2 와 충돌하는 문제 회피
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: opus-kr-assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # build_assets.py 의 X | None 문법은 3.10+

      - name: Install deps
        run: pip install "UnityPy==1.25.2"

      - name: Resolve translation variant (태그 접미사 → 프로젝트)
        run: |
          # 수동 실행이면 입력값, 태그 push면 접미사(v0.1-EN → EN)에서 변형 추출.
          RAW="${{ github.event.inputs.variant }}"
          if [ -z "$RAW" ]; then
            TAG="${GITHUB_REF_NAME}"
            SUFFIX="${TAG##*-}"                 # 마지막 - 뒤
            [ "$SUFFIX" = "$TAG" ] && SUFFIX="" # 대시 없으면 접미사 없음
            RAW="$SUFFIX"
          fi
          case "$(echo "$RAW" | tr '[:upper:]' '[:lower:]')" in
            en|en2kr)               PROJECT=Trans-EN2KR ;;
            cht|cht2kr)             PROJECT=Trans-CHT2KR ;;
            complex|complex2kr|"")  PROJECT=Trans-Complex2KR ;;
            *) echo "::error::알 수 없는 변형 접미사 '$RAW' (지원: EN / CHT / Complex)"; exit 1 ;;
          esac
          echo "선택된 변형: $PROJECT  (태그/입력: ${GITHUB_REF_NAME}${{ github.event.inputs.variant && format(' / {0}', github.event.inputs.variant) || '' }})"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Fetch fontready base from R2 (게임 버전 키)
        run: |
          # 모든 *2KR 은 동일한 KR 폰트베이스를 공유 → Complex 위치에 받아 공유 폴백으로 사용.
          GAME_VERSION="$(tr -d '[:space:]' < Common/GAME_VERSION)"
          echo "game version: $GAME_VERSION"
          mkdir -p Trans-Complex2KR/build
          aws s3 cp \
            "s3://$R2_BUCKET/$GAME_VERSION/sharedassets2.assets.fontready" \
            "Trans-Complex2KR/build/sharedassets2.assets.fontready" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Build patched asset (번역 주입)
        run: python build_assets.py "$PROJECT"

      - name: Sanity check output
        run: |
          f="$PROJECT/build/sharedassets2.assets"
          test -f "$f" || { echo "산출물 없음: $f"; exit 1; }
          sz=$(stat -c%s "$f")
          echo "output size: $sz bytes"
          # inject_kr 자체 검증과 동일 기준: 100MB 미만이면 재저장 손상 의심
          [ "$sz" -gt 100000000 ] || { echo "산출물이 너무 작음 — 손상 의심"; exit 1; }

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 파일명은 sharedassets2.assets 그대로 → 설치 시 개명 불필요.
          f="$PROJECT/build/sharedassets2.assets"
          notes="OPUS: Echo of Starsong 비공식 한국어 패치 ${GITHUB_REF_NAME} (${PROJECT#Trans-}).
          sharedassets2.assets 를 게임 설치 폴더의 'OPUS Echo of Starsong_Data' 안에 덮어쓰세요."
          gh release create "${GITHUB_REF_NAME}" "$f" \
            --title "${GITHUB_REF_NAME}" --notes "$notes" \
          || gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
